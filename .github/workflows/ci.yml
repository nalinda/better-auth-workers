name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install

      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.js') }}-
            ${{ runner.os }}-eslint-

      - name: Lint
        run: bun run lint

  types:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install

      - name: Cache tsc build info
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('bun.lock', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('bun.lock', 'tsconfig*.json') }}-
            ${{ runner.os }}-tsc-

      - name: Type check
        run: bun run ts-check

      # The published artefact: the same bundling and declaration emit the
      # release workflow runs, so a build that would break `bun publish`
      # fails here, on the pull request.
      - name: Build (dist)
        run: bun run build

  # What a consumer pinning a release asset gets: the packed tarball,
  # installed into a fresh Bun project, with every entry point imported.
  # That install resolves better-auth's dependencies from the registry with
  # no lockfile and runs them, so this job touches no shared cache: it
  # neither restores nor saves node_modules or Bun's download cache, and
  # nothing it resolves can reach a later build.
  packed-install:
    name: Packed tarball installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (uncached)
        run: bun install --frozen-lockfile

      - name: Build (dist)
        run: bun run build

      - name: Check the packed tarball installs and imports
        run: scripts/check-packed-install.sh

  format-and-audit:
    name: Format & Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install

      - name: Format check
        run: bun run format:check

      - name: Knip (unused files/exports/deps)
        run: bun run knip

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install

      - name: Test
        run: bun run test

  integration-tests:
    name: Integration tests (wrangler dev)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both backends run in one job: D1 against wrangler's local SQLite,
      # Hyperdrive against the Postgres service container above.
      INTEGRATION_BACKENDS: d1,hyperdrive
      INTEGRATION_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install

      - name: Run the example Worker under wrangler dev
        run: bun run test:integration
